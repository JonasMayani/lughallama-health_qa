# config_lugha.yaml — Lugha-Llama-8B QLoRA fine-tuning
#
# Lugha-Llama is Llama-3.1-8B continued-pretrained on African languages.
# CRITICAL: it is a BASE model (not instruction-tuned), so there is NO chat
# template. We use a plain instruction prompt with an explicit response marker
# and train the model to continue after it. This is the main difference from
# the Aya pipeline (which used apply_chat_template).
#
# Variants (pick via model.base_model):
#   Lugha-Llama/Lugha-Llama-8B            (base African-adapted)
#   Lugha-Llama/Lugha-Llama-8B-wura_edu   (best on IrokoBench; recommended)
#   Lugha-Llama/Lugha-Llama-8B-wura_math  (math-leaning)

seed: 42
deterministic: true

paths:
  workspace: /workspace/lugha-health-qa
  data_raw: /workspace/lugha-health-qa/data/raw
  data_cleaned: /workspace/lugha-health-qa/data/cleaned
  data_augmented: /workspace/lugha-health-qa/data/augmented
  models: /workspace/lugha-health-qa/models/checkpoints
  submissions: /workspace/lugha-health-qa/submissions
  reports: /workspace/lugha-health-qa/reports
  logs: /workspace/lugha-health-qa/logs

dataset:
  train_file: data/augmented/final_train_v2.csv
  val_file: data/cleaned/val_clean.csv
  test_file: data/raw/Test.csv
  id_col: ID
  input_col: input
  output_col: output
  subset_col: subset
  languages: [Eng_Uga, Aka_Gha, Eng_Gha, Eng_Eth, Lug_Uga, Eng_Ken, Swa_Ken, Amh_Eth]

language_names:
  Eng_Uga: English
  Aka_Gha: Akan
  Eng_Gha: English
  Eng_Eth: English
  Lug_Uga: Luganda
  Eng_Ken: English
  Swa_Ken: Swahili
  Amh_Eth: Amharic

model:
  base_model: Lugha-Llama/Lugha-Llama-8B-wura_edu   # -edu is best on IrokoBench
  max_seq_length: 768
  max_prompt_length: 320
  max_new_tokens: 256

  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

# ─── LoRA — Llama target modules (same as Aya; both are Llama-family) ───────
lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  bias: none
  task_type: CAUSAL_LM

optimiser:
  optim: paged_adamw_8bit
  lr: 2.0e-4
  weight_decay: 0.0
  lr_scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 0.3

training:
  epochs: 3
  output_dir_suffix: lugha8b_4bit_v1
  early_stopping_patience: 2

  per_device_train_batch: 4        # start small (Aya OOM'd at 12); raise if VRAM allows
  per_device_eval_batch: 4
  gradient_accumulation: 9          # 4 × 9 = effective batch 36

  auto_batch_size: false
  min_per_device_train_batch: 1
  max_per_device_train_batch: 8

  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  resume_from_checkpoint: auto
  eval_max_samples: 600

# ─── Prompt — PLAIN instruction format (NO chat template; base model) ──────
# We construct: <instruction + question><response marker><answer><eos>
# Training masks everything up to and including the response marker; loss is
# computed only on the answer tokens.
prompt:
  template: "You are a multilingual health assistant. Answer the question accurately and completely in {language}.\n\nQuestion: {question}\n\nAnswer:"
  # The answer is appended after this during training, and generated after it at inference.

decoding:
  default:
    do_sample: false
    temperature: 0.3
    top_p: 0.9
    repetition_penalty: 1.15
    no_repeat_ngram_size: 3
    min_new_tokens: 30
    max_new_tokens: 256
  per_language: {}

evaluation:
  rouge_types: [rouge1, rougeL]
  metric_weights: {rouge1_f1: 0.37, rougeL_f1: 0.37, llm_judge: 0.26}
  keep_prefix: true

tracking:
  backend: none
  run_name: lugha-llama-8b-4bit-qlora-v1
